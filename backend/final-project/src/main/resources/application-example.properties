# application.properties 예시 파일입니다.
# 이 파일을 application.properties로 복사한 뒤 <...> 값을 채워서 사용하세요.
# 실제 비밀번호·키가 들어간 application.properties는 커밋하지 않습니다(.gitignore).

spring.application.name=final-project
server.servlet.context-path=/workly
server.port=8003

# Oracle DB
spring.datasource.url=jdbc:oracle:thin:@<DB_HOST>:1521:<SID>
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=<DB_USERNAME>
spring.datasource.password=<DB_PASSWORD>

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.configuration.map-underscore-to-camel-case=true

# 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/

# JWT
jwt.secretkey=<BASE64_SECRET_KEY>

# 메일 (비밀번호 찾기 등)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<MAIL_ADDRESS>
spring.mail.password=<MAIL_APP_PASSWORD>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
